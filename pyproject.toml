[project]
name = "lead_outreach_manager"
authors = [
    { name = "Kien Phi", email = "phivinhkien1710@gmail.com"}
]
description = "Turns verified Singapore industrial-zone leads into company profiles and manages template-based, compliance-gated outreach email generation and scheduled sending via ERPNext own email infrastructure."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
